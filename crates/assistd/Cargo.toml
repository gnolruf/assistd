[package]
name = "assistd-cli"
version.workspace = true
edition.workspace = true
license.workspace = true
rust-version.workspace = true

[[bin]]
name = "assistd"
path = "src/main.rs"

[features]
default = ["chat", "tray", "i3", "sway"]
i3 = ["assistd-wm/i3"]
sway = ["assistd-wm/sway"]
chat = ["dep:assistd-chat"]
tray = [
    "dep:ksni",
    "dep:zbus",
]

[dependencies]
dirs = { workspace = true }
assistd-chat   = { workspace = true, optional = true }
assistd-config = { workspace = true }
assistd-core   = { workspace = true }
assistd-embed  = { workspace = true }
assistd-ipc    = { workspace = true, features = ["client"] }
assistd-llm    = { workspace = true }
assistd-mcp    = { workspace = true }
assistd-memory = { workspace = true }
assistd-search = { workspace = true }
assistd-tools  = { workspace = true }
assistd-utils  = { workspace = true }
assistd-voice  = { workspace = true }
assistd-wm     = { workspace = true }
anyhow = { workspace = true }
async-trait = { workspace = true }
chrono = { workspace = true }
clap = { workspace = true }
futures-util = { workspace = true }
parking_lot = { workspace = true }
serde_json = { workspace = true }
tempfile = { workspace = true }
tokio = { workspace = true, features = ["full"] }
tokio-util = { workspace = true }
tracing = { workspace = true }
tracing-subscriber = { workspace = true }
uuid = { workspace = true }

ksni             = { workspace = true, optional = true }
zbus             = { workspace = true, optional = true }

[lints]
workspace = true
