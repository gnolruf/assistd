[package]
name = "assistd-cli"
version.workspace = true
edition.workspace = true
license.workspace = true
rust-version.workspace = true

[[bin]]
name = "assistd"
path = "src/main.rs"

[features]
default = ["chat", "tray", "i3", "sway", "wayland"]
cuda = ["assistd-voice/cuda"]
i3 = ["assistd-wm/i3"]
sway = ["assistd-wm/sway"]
wayland = ["assistd-wm/wayland"]
chat = [
    "dep:ratatui",
    "dep:crossterm",
    "dep:futures-util",
    "dep:tracing-appender",
    "dep:textwrap",
    "dep:pulldown-cmark",
    "dep:shlex",
    "dep:ratatui-image",
    "dep:image",
]
tray = [
    "dep:ksni",
    "dep:zbus",
    "dep:futures-util",
]

[dependencies]
dirs = { workspace = true }
assistd-config = { workspace = true }
assistd-core   = { workspace = true }
assistd-embed  = { workspace = true }
assistd-ipc    = { workspace = true }
assistd-llm    = { workspace = true }
assistd-mcp    = { workspace = true }
assistd-memory = { workspace = true }
assistd-tools  = { workspace = true }
assistd-utils  = { workspace = true }
assistd-voice  = { workspace = true }
assistd-wm     = { workspace = true }
anyhow = { workspace = true }
async-trait = { workspace = true }
clap = { workspace = true }
global-hotkey = { workspace = true }
nvml-wrapper = { workspace = true }
procfs = { workspace = true }
rustix = { workspace = true }
serde_json = { workspace = true }
tokio = { workspace = true, features = ["full"] }
tokio-util = { workspace = true }
tracing = { workspace = true }
tracing-subscriber = { workspace = true }
uuid = { workspace = true }

ratatui          = { workspace = true, optional = true }
crossterm        = { workspace = true, optional = true }
futures-util     = { workspace = true, optional = true }
tracing-appender = { workspace = true, optional = true }
textwrap         = { workspace = true, optional = true }
pulldown-cmark   = { workspace = true, optional = true }
shlex            = { workspace = true, optional = true }
ratatui-image    = { workspace = true, optional = true }
image            = { workspace = true, optional = true }
ksni             = { workspace = true, optional = true }
zbus             = { workspace = true, optional = true }

[dev-dependencies]
tempfile = { workspace = true }

[lints]
workspace = true
