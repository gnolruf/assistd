[package]
name = "assistd-voice"
version.workspace = true
edition.workspace = true
license.workspace = true
rust-version.workspace = true

[features]
default = ["stt", "mic", "listen", "tts"]
stt = [
    "dep:nvml-wrapper",
    "dep:num-traits",
    "dep:sherpa-onnx",
]
# Requires `stt` because `MicVoiceInput` hands its audio to a `Transcriber`.
mic = ["stt", "dep:cpal", "dep:ringbuf", "dep:rubato"]
listen = ["mic", "dep:sentencepiece-rust"]
# Pulls in rodio (which itself uses cpal) and sherpa-onnx.
tts = [
    "dep:rodio",
    "dep:sherpa-onnx",
]
test-support = ["stt", "mic", "listen", "tts"]

[[example]]
name = "voice_latency_bench"
required-features = ["stt", "tts"]

[dependencies]
dirs = { workspace = true }
async-trait = { workspace = true }
tokio = { workspace = true, features = ["macros", "rt", "rt-multi-thread", "sync", "time", "io-util", "fs", "process"] }
tracing = { workspace = true }
thiserror = { workspace = true }
assistd-ipc = { workspace = true }
assistd-config = { workspace = true }
assistd-utils = { workspace = true }
parking_lot = { workspace = true }

nvml-wrapper = { workspace = true, optional = true }
num-traits = { workspace = true, optional = true }

cpal = { workspace = true, optional = true }
ringbuf = { workspace = true, optional = true }
rubato = { workspace = true, optional = true }

rodio = { workspace = true, optional = true }
sherpa-onnx = { workspace = true, optional = true }
sentencepiece-rust = { workspace = true, optional = true }

[dev-dependencies]
anyhow = { workspace = true }
assistd-llm = { workspace = true }
clap = { workspace = true }
tokio = { workspace = true, features = ["macros", "rt", "rt-multi-thread", "test-util"] }
tracing-subscriber = { workspace = true }
tempfile = { workspace = true }
reqwest = { workspace = true }
hound = { workspace = true }
serde = { workspace = true }
serde_json = { workspace = true }

[lints]
workspace = true
