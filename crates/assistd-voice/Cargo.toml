[package]
name = "assistd-voice"
version.workspace = true
edition.workspace = true
license.workspace = true
rust-version.workspace = true

[features]
default = ["whisper", "mic", "listen", "tts"]
whisper = [
    "dep:whisper-rs",
    "dep:reqwest",
    "dep:nvml-wrapper",
    "dep:futures-util",
]
# Requires `whisper` because `MicVoiceInput` wraps `WhisperTranscriber`.
mic = ["whisper", "dep:cpal", "dep:ringbuf", "dep:rubato"]
listen = ["mic", "dep:webrtc-vad"]
# Pulls in rodio (which itself uses cpal) and reqwest (shared with whisper).
tts = [
    "dep:rodio",
    "dep:serde",
    "dep:serde_json",
    "dep:reqwest",
    "dep:futures-util",
    "dep:which",
]
cuda = ["whisper", "whisper-rs/cuda"]
test-support = ["whisper", "mic", "listen", "tts"]

[[example]]
name = "voice_latency_bench"
required-features = ["whisper", "tts"]

[dependencies]
async-trait = { workspace = true }
tokio = { workspace = true, features = ["macros", "rt", "rt-multi-thread", "sync", "time", "io-util", "fs", "process"] }
tracing = { workspace = true }
thiserror = { workspace = true }
assistd-ipc = { workspace = true, features = ["client"] }
# Required unconditionally because `sentence` (built in every feature combination)
# consumes the `CodeBlockMode` enum.
assistd-config = { workspace = true }
parking_lot = { workspace = true }

whisper-rs = { workspace = true, optional = true }
reqwest = { workspace = true, optional = true, features = ["stream"] }
nvml-wrapper = { workspace = true, optional = true }
futures-util = { workspace = true, optional = true }

cpal = { workspace = true, optional = true }
ringbuf = { workspace = true, optional = true }
rubato = { workspace = true, optional = true }

webrtc-vad = { workspace = true, optional = true }

rodio = { workspace = true, optional = true }
serde = { workspace = true, optional = true }
serde_json = { workspace = true, optional = true }
which = { workspace = true, optional = true }

[dev-dependencies]
anyhow = { workspace = true }
assistd-llm = { workspace = true }
clap = { workspace = true }
tokio = { workspace = true, features = ["macros", "rt", "rt-multi-thread", "test-util"] }
tracing-subscriber = { workspace = true }
tempfile = { workspace = true }
hound = { workspace = true }

[lints]
workspace = true
