[package]
name = "assistd-tools"
version.workspace = true
edition.workspace = true
license.workspace = true
rust-version.workspace = true

[features]
i3 = ["assistd-wm/i3"]
sway = ["assistd-wm/sway"]
test-support = []

[dependencies]
assistd-config = { workspace = true }
assistd-embed = { workspace = true }
assistd-memory = { workspace = true }
assistd-ipc = { workspace = true, features = ["client"] }
assistd-wm = { workspace = true }
async-trait = { workspace = true }
serde = { workspace = true }
serde_json = { workspace = true }
toml = { workspace = true }
thiserror = { workspace = true }
tokio = { workspace = true, features = ["macros", "rt", "rt-multi-thread", "sync", "time", "io-util", "fs", "process"] }
tracing = { workspace = true }
regex = { workspace = true }
glob = { workspace = true }
reqwest = { workspace = true }
base64 = { workspace = true }
infer = { workspace = true }
uuid = { workspace = true }
parking_lot = { workspace = true }
rustix = { workspace = true }
libc = { workspace = true }

[dev-dependencies]
assistd-tools = { workspace = true, features = ["test-support"] }
tempfile = { workspace = true }

[lints]
workspace = true
