[workspace]
resolver = "3"
members = [
    "crates/assistd",
    "crates/assistd-config",
    "crates/assistd-core",
    "crates/assistd-embed",
    "crates/assistd-ipc",
    "crates/assistd-llm",
    "crates/assistd-mcp",
    "crates/assistd-memory",
    "crates/assistd-voice",
    "crates/assistd-tools",
    "crates/assistd-utils",
    "crates/assistd-wm",
]
default-members = ["crates/assistd"]

[workspace.package]
version = "1.2.1"
edition = "2024"
license = "Apache-2.0"
rust-version = "1.98"

[workspace.dependencies]
assistd-config = { version = "1.1", path = "crates/assistd-config" }
assistd-core   = { version = "1.1", path = "crates/assistd-core" }
assistd-embed  = { version = "1.1", path = "crates/assistd-embed" }
assistd-ipc    = { version = "1.1", path = "crates/assistd-ipc" }
assistd-llm    = { version = "1.1", path = "crates/assistd-llm" }
assistd-mcp    = { version = "1.1", path = "crates/assistd-mcp" }
assistd-memory = { version = "1.1", path = "crates/assistd-memory" }
assistd-voice  = { version = "1.1", path = "crates/assistd-voice" }
assistd-tools  = { version = "1.1", path = "crates/assistd-tools" }
assistd-utils  = { version = "1.1", path = "crates/assistd-utils", default-features = false }
assistd-wm     = { version = "1.1", path = "crates/assistd-wm", default-features = false }

serde = { version = "1", features = ["derive"] }
serde_json = "1"
tokio = { version = "1.52.3", default-features = false }
tokio-util = { version = "0.7", features = ["rt"] }
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
anyhow = "1"
thiserror = "2.0.18"
toml = "1.1.2"
clap = { version = "4.6.1", features = ["derive"] }
uuid = { version = "1.23.1", features = ["v4"] }
async-trait = "0.1"
reqwest = { version = "0.13.4", default-features = false, features = ["rustls", "json"] }
libc = "0.2.186"
rustix = { version = "1", features = ["event", "fs", "stdio", "process"] }
procfs = { version = "0.18", default-features = false }
dirs = "7"
ratatui = { version = "0.30", default-features = false, features = ["crossterm"] }
crossterm = { version = "0.29", features = ["event-stream"] }
futures-util = "0.3"
tracing-appender = "0.2.5"
textwrap = "0.16"
pulldown-cmark = { version = "0.13", default-features = false }
nvml-wrapper = "0.13"
num-traits = "0.2.19"
global-hotkey = "0.8"
regex = "1"
glob = "0.3"
tempfile = "3"
base64 = "0.23"
infer = "0.22"
shlex = "2"
which = "8.0.2"
rodio = { version = "0.22", default-features = false, features = ["playback"] }
ratatui-image = { version = "11.0.2", default-features = false, features = ["crossterm"] }
image = { version = "0.25", default-features = false, features = ["png", "jpeg", "webp"] }
rusqlite = { version = "0.37", features = ["bundled", "blob"] }
tokio-rusqlite = "0.7"
rusqlite_migration = "2.3"
chrono = { version = "0.4", default-features = false, features = ["clock", "serde"] }
tokio-i3ipc = "0.16"
swayipc-async = "3"
url = { version = "2", features = ["serde"] }
parking_lot = "0.12"
ksni = { version = "0.3.4", default-features = false, features = ["tokio"] }
zbus = { version = "5.15", default-features = false, features = ["tokio"] }
whisper-rs = { version = "0.16", default-features = false, features = ["tracing_backend"] }
cpal = "0.18.1"
ringbuf = "0.5"
rubato = "5.0"
webrtc-vad = "0.4"
hound = "3.5"
wayland-client = "0.31"
wayland-protocols = { version = "0.32", features = ["client", "staging"] }
landlock = "0.4.7"
rmcp = { version = "3.5", default-features = false, features = ["client", "transport-async-rw"] }

[workspace.lints.rust]
unsafe_code = "deny"
rust_2018_idioms = { level = "warn", priority = -1 }
meta_variable_misuse = "warn"
missing_debug_implementations = "warn"
redundant_lifetimes = "warn"
trivial_numeric_casts = "warn"
unit_bindings = "warn"
unreachable_pub = "warn"
unused_import_braces = "warn"
unused_lifetimes = "warn"
unused_qualifications = "warn"

[workspace.lints.clippy]
all = { level = "warn", priority = -1 }
allow_attributes_without_reason = "warn"
assigning_clones = "warn"
bool_to_int_with_if = "warn"
cast_lossless = "warn"
cast_possible_truncation = "warn"
cast_possible_wrap = "warn"
cast_sign_loss = "warn"
dbg_macro = "deny"
doc_markdown = "warn"
float_cmp = "warn"
ignored_unit_patterns = "warn"
large_futures = "warn"
manual_assert = "warn"
manual_let_else = "warn"
map_unwrap_or = "warn"
match_wild_err_arm = "warn"
match_wildcard_for_single_variants = "warn"
mod_module_files = "warn"
needless_pass_by_value = "warn"
needless_raw_string_hashes = "warn"
print_stderr = "warn"
print_stdout = "warn"
redundant_closure_for_method_calls = "warn"
redundant_else = "warn"
ref_option = "warn"
semicolon_if_nothing_returned = "warn"
todo = "warn"
too_many_lines = "warn"
trivially_copy_pass_by_ref = "warn"
unchecked_time_subtraction = "warn"
undocumented_unsafe_blocks = "warn"
uninlined_format_args = "warn"
unnecessary_literal_bound = "warn"
unnested_or_patterns = "warn"
unused_async = "warn"
used_underscore_binding = "warn"

[profile.release]
lto = "thin"
codegen-units = 1
strip = "symbols"
