[tools.write]
# writable_paths = ["~"]  # besides tools.scratch.dir

[memory]
# enabled = true  # false: no memory tools or recalled context; chats are still saved

[embedding]
# A second model server for semantic recall.
# enabled = true
# model = "nomic-ai/nomic-embed-text-v1.5-GGUF:Q4_K_M"  # suffix is a quant tag, not a filename
# server_binary = "llama-server"
# host = "127.0.0.1"
# port = 8386  # must differ from model.port
# gpu_layers = 0
# ready_timeout_secs = 300
# custom_args = "--threads 4 --ubatch-size 2048"  # same rules as model.custom_args
# top_k = 5  # at most 20
# auto_inject = true

[search]
# A local SearXNG instance the web command searches through.
# enabled = false
# command = "searxng-run"  # shell-quoted, never run through a shell
# host = "127.0.0.1"
# port = 8387  # must differ from model.port and embedding.port
# ready_timeout_secs = 60
# engines = ["bing", "yahoo"]  # SearXNG engine names; only these load
# engines = [{ name = "braveapi", api_key_file = "~/.config/assistd/brave_api_key" }]

# [mcp]
# External tool servers, exposed to the model as mcp__<name>__<tool>.
# enabled = false
#
# [[mcp.servers]]
# name = "filesystem"  # required
# command = "npx"  # required
# args = ["-y", "@modelcontextprotocol/server-filesystem", "/home/me/docs"]  # secrets belong in env
# env = { API_TOKEN = "..." }  # only PATH, HOME, locale and a few basics are inherited
# request_timeout_secs = 30

# [notifications]
# Desktop notifications from `assistd tray`; none while the chat is focused.
# enabled = true
# auto_hide_ms = 3000
# brief_when_away = true  # short replies to voice turns while the chat is unfocused

# [notifications.icons]
# Icon-theme names for the tray icon; custom icons go in ~/.local/share/icons/<theme>/.
# active = "user-available"
# sleeping = "user-offline"          # drowsy, asleep, or loading
# listening = "audio-input-microphone"  # wake phrase heard, or push-to-talk
# generating = "system-run"
# disconnected = "network-offline"
