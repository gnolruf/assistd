[tools.write]
# writable_paths = ["~", "/tmp"]

[tools.screenshot]
# backend = "auto"  # auto | x11 | wayland

[memory]
# enabled = true
# db_path = "/home/you/.local/share/assistd/memory.db"

[embedding]
# A second llama-server for semantic recall.
# enabled = true
# model = "nomic-ai/nomic-embed-text-v1.5-GGUF:Q4_K_M"  # suffix is a quant tag, not a filename
# host = "127.0.0.1"
