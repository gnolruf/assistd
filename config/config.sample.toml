# assistd configuration. Copy to ~/.config/assistd/config.toml.
# Every key is optional; commented keys show a default or an example. Unknown keys are an error.
# Units, ranges and validation rules are documented on the assistd-config schema types.

[model]
name = "unsloth/Qwen3.6-35B-A3B-GGUF:Q4_K_M"  # owner/repo:quant
context_length = 8192

[llama_server]
binary_path = "llama-server"
host = "127.0.0.1"
port = 8385
# gpu_layers = 9999  # -ngl; 9999 offloads every layer
# ready_timeout_secs = 300  # raise for slow first-time downloads
# alias = "qwen3.6-35b-a3b"
# override_tensor = "\\.ffn_(up|down|gate)_exps\\.=CPU"
# flash_attn = true
# cache_type_k = "q8_0"
# cache_type_v = "q8_0"
# threads = 8
# batch_size = 2048
# ubatch_size = 2048
# n_cpu_moe = 30  # MoE expert layers kept on CPU
# cache_ram_mib = 32768
# mlock = true  # needs a large enough RLIMIT_MEMLOCK
# mmproj_offload = false  # keep the vision encoder on CPU

[chat]
# Empty disables the system prompt; don't list tools, requests already carry them.
system_prompt = "You are assistd, a concise local desktop assistant running on a Linux workstation. When a question is about this machine or its files, prefer calling a tool over guessing. Answer precisely and in a conversational tone."
max_history_tokens = 6000  # older history is summarized past this
summary_target_tokens = 1000
preserve_recent_turns = 4
temperature = 0.7
# top_p = 0.95
# top_k = 20
# min_p = 0.0
# presence_penalty = 1.5
max_response_tokens = 1024
request_timeout_secs = 120  # wait for the first token
# summary_temperature = 0.3

[voice]
enabled = false
# mic_device = "hw:0,0"
hotkey = "Super+Space"  # hold to talk; empty disables
# max_recording_secs = 60

[voice.transcription]
# model = "ggerganov/whisper.cpp:ggml-large-v3-turbo-q5_0.bin"
# prefer_gpu = true
# threads = 8
# beams = 1  # 1 = greedy
# vad_enabled = true
# vad_model = "ggml-org/whisper-vad:ggml-silero-v6.2.0.bin"
# model_cache_dir = "/var/cache/assistd/whisper"

[voice.continuous]
# Hands-free listening: each detected utterance is sent as a query.
enabled = false
# start_on_launch = false
# hotkey = "Super+Shift+L"  # toggles listening
# silence_ms = 800  # trailing silence that ends an utterance
# max_utterance_secs = 30

[voice.synthesis]
# Speak replies with Piper TTS.
enabled = false
# binary_path = "piper"
# voice = "rhasspy/piper-voices:en/en_US/lessac/medium/en_US-lessac-medium.onnx"
# model_cache_dir = "/var/cache/assistd/piper"
# length_scale = 1.0  # lower speaks faster
# espeak_data_dir = "/usr/share/espeak-ng-data"
# deadline_secs = 30
# max_sentence_chars = 400
# partial_flush_ms = 750  # 0 disables
# code_block_mode = "skip"  # skip | summarize
# use_cuda = false
# toggle_hotkey = ""  # toggles TTS
# skip_hotkey = ""  # stops the current reply

[compositor]
type = "auto"  # auto | i3 | sway | hyprland

[sleep]
# idle_to_drowsy_mins = 30  # 0 disables
# idle_to_sleep_mins = 120  # 0 disables
# gpu_monitor_enabled = true  # sleep when another process claims VRAM
# gpu_poll_secs = 5
# gpu_vram_threshold_mb = 2048
# gpu_auto_wake = false
# gpu_allowlist = ["Xorg", "Xwayland", "gnome-shell", "kwin_x11", "kwin_wayland", "firefox", "chromium", "chrome"]
# gpu_denylist = []

[presence]
hotkey = "Super+Escape"  # cycles presence; X11 only, empty disables

[daemon]
# shutdown_grace_secs = 5  # 0 aborts in-flight requests immediately

[tools.output]
# max_lines = 200
# max_kb = 50
# overflow_dir = "/tmp/assistd-output"

[tools.bash]
