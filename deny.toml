# cargo-deny configuration for assistd.
#
# Checks licenses, advisories, and dependency duplication. Run locally with
#   cargo deny check
# or see .github/workflows/ci.yml for the CI invocation.
#
# Documentation: https://embarkstudios.github.io/cargo-deny/

[graph]
# Only the host target matters for this daemon.
targets = [
    { triple = "x86_64-unknown-linux-gnu" },
]
all-features = true

# ---------------------------------------------------------------------------
# Advisories: block known-vulnerable or yanked versions.
# ---------------------------------------------------------------------------
[advisories]
db-path = "~/.cargo/advisory-db"
db-urls = ["https://github.com/rustsec/advisory-db"]
yanked = "deny"
# Unmaintained crates are reported wherever they sit in the graph, which is
# what the ignores below for transitive ones assume. Set here because the
# default differs between cargo-deny releases.
unmaintained = "all"
ignore = [
    # zbus 5's split-out crates, merged into zbus 6. ksni (tray) still pins
    # zbus 5; drop these once a ksni release moves to zbus 6.
    { id = "RUSTSEC-2026-0370", reason = "zvariant via zbus 5, pinned by ksni" },
    { id = "RUSTSEC-2026-0371", reason = "zbus_names via zbus 5, pinned by ksni" },
    { id = "RUSTSEC-2026-0372", reason = "zvariant_derive via zbus 5, pinned by ksni" },
    # Bundled SQLite before 3.54; the fix needs rusqlite 0.41, which neither
    # tokio-rusqlite nor rusqlite_migration supports yet. Exploiting it needs
    # write access to the user's own memory.db. Drop once both support 0.41.
    { id = "RUSTSEC-2026-0459", reason = "libsqlite3-sys via rusqlite 0.37, pinned by tokio-rusqlite and rusqlite_migration" },
    # chrono and chrono-tz are flagged unmaintained, not vulnerable, and no
    # version clears the flag. croner, oauth2, rmcp and schemars depend on
    # chrono too, so moving our own timestamps off it would not remove it;
    # chrono-tz is a dev-dependency for the scheduler's time-zone tests.
    # Drop once those crates have moved off chrono.
    { id = "RUSTSEC-2026-0543", reason = "chrono, used directly and required by croner, oauth2, rmcp and schemars" },
    { id = "RUSTSEC-2026-0555", reason = "chrono-tz, a dev-dependency of assistd-core for time-zone tests" },
    # ttf-parser is flagged unmaintained, not vulnerable. pdf_oxide requires
    # it to read the fonts in a PDF, which happens only in the sandboxed
    # extraction worker. Drop once pdf_oxide moves to another font parser.
    { id = "RUSTSEC-2026-0192", reason = "ttf-parser, required by pdf_oxide" },
]

# ---------------------------------------------------------------------------
# Licenses: keep the dependency set Apache-2.0-compatible.
# ---------------------------------------------------------------------------
[licenses]
confidence-threshold = 0.93
allow = [
    "Apache-2.0",
    "Apache-2.0 WITH LLVM-exception",
    "MIT",
    "BSD-3-Clause",
    "ISC",
    "Unicode-3.0",
    "Zlib",
    # ksni (the tray) ships under the Unlicense, a public-domain dedication:
    # OSI-approved and compatible with our Apache-2.0 downstream.
    "Unlicense",
]

# Per-crate license exceptions for crates whose terms only make sense
# in context. Keep these narrowly scoped — promoting a font licence to
# a workspace-wide allow would let it apply to code crates too.
[[licenses.exceptions]]
# option-ext (via dirs → dirs-sys) is MPL-2.0: file-level copyleft that
# only binds modifications to its own source files. We use it unmodified,
# so it doesn't constrain the Apache-2.0 code we distribute.
name = "option-ext"
allow = ["MPL-2.0"]

[[licenses.exceptions]]
# notify (inotify watches for path-changed task triggers) is CC0-1.0, a
# public-domain dedication with no conditions on downstream use.
name = "notify"
allow = ["CC0-1.0"]

[[licenses.exceptions]]
# arrayref (via tiny-skia, which pdf_oxide renders PDF pages with) is
# BSD-2-Clause: permissive, asking only that its notice be kept.
name = "arrayref"
allow = ["BSD-2-Clause"]

# The next three only run inside sherpa-onnx-sys's build script, which
# downloads and unpacks its prebuilt library archive; none of them is
# linked into assistd. All three licences are permissive.
[[licenses.exceptions]]
# bzip2 decoder for the .tar.bz2 archive; BSD-style bzip2 licence.
name = "libbz2-rs-sys"
allow = ["bzip2-1.0.6"]

[[licenses.exceptions]]
# PPMd codec pulled in by the zip crate.
name = "ppmd-rust"
allow = ["CC0-1.0", "MIT-0"]

[[licenses.exceptions]]
# Mozilla's CA roots, used by ureq for the archive download.
name = "webpki-roots"
allow = ["CDLA-Permissive-2.0"]

# ---------------------------------------------------------------------------
# Bans / multiple-version check.
# ---------------------------------------------------------------------------
#
# We warn on duplicates rather than deny them: most are transitive via
# mainstream crates (ratatui, nvml-wrapper, reqwest) that we don't control,
# and an ecosystem-wide bump typically resolves them on its own. The
# `skip` list below documents known, benign duplicates as of 2026-04 so
# CI stays green without silently losing signal on *new* duplicates that
# show up in future dependency updates.
[bans]
multiple-versions = "warn"
wildcards = "deny"
# Workspace-internal crates use `path = ...` which cargo-deny would
# otherwise flag as a wildcard. These are not published; they travel as
# a unit with the workspace.
allow-wildcard-paths = true
highlight = "all"

skip = [
    # Proc-macro helpers pulled in by different ecosystems (ratatui's
    # `instability` vs. nvml-wrapper's `wrapcenum-derive`).
    { name = "darling", version = "0.20" },
    { name = "darling_core", version = "0.20" },
    { name = "darling_macro", version = "0.20" },
    # Transitive via crossterm (older) vs tempfile/x11rb (newer).
    { name = "rustix", version = "0.38" },
    { name = "linux-raw-sys", version = "0.4" },
    # Transitive via ring/rustls (older) vs tempfile/uuid (newer).
    { name = "getrandom", version = "0.2" },
    # Transitive via ratatui (older) vs toml_edit/indexmap (newer).
    { name = "hashbrown", version = "0.15" },
    # nvml-wrapper still pins thiserror 1; tracing-appender pulls
    # thiserror 2.
    { name = "thiserror", version = "1" },
    { name = "thiserror-impl", version = "1" },
    # hashbrown 0.15 (rusqlite) brings foldhash 0.1; ratatui/vello are
    # on hashbrown 0.16 → foldhash 0.2.
    { name = "foldhash", version = "0.1" },
    # ratatui-core 0.1 sits on hashbrown 0.16; zbus's toml_edit pulls
    # hashbrown 0.17 transitively.
    { name = "hashbrown", version = "0.16" },
    # ratatui-image and oauth2 still depend directly on rand 0.8; the
    # quantette → icy_sixel path ratatui-image also pulls is on rand 0.9.
    { name = "rand", version = "0.8" },
    { name = "rand_core", version = "0.6" },
    # The workspace is on base64 0.23; reqwest's hyper-util is still on
    # 0.22. Resolves when hyper-util bumps.
    { name = "base64", version = "0.22" },
    # We use shlex 2 directly; cc 1.2 is still on shlex 1.
    { name = "shlex", version = "1" },
    # The ecosystem is mid-migration to syn 3: serde_derive, async-trait,
    # clap_derive, futures-macro and thiserror-impl 2 are already there,
    # while tokio-macros, tracing-attributes, zbus, darling and icu still
    # pull syn 2. Drops out as those crates bump.
    { name = "syn", version = "2" },
    # The workspace is on sha2 0.11, as are zip and pdf_oxide; oauth2 5 is
    # still on sha2 0.10 and the digest stack beneath it.
    { name = "sha2", version = "0.10" },
    { name = "digest", version = "0.10" },
    { name = "block-buffer", version = "0.10" },
    { name = "crypto-common", version = "0.1" },
    { name = "cpufeatures", version = "0.2" },
    # The workspace is on parking_lot 0.13; tokio, crossterm and
    # string_cache are still on 0.12.
    { name = "parking_lot", version = "0.12" },
    { name = "parking_lot_core", version = "0.9" },
    { name = "lock_api", version = "0.4" },
    # quantette (via ratatui-image's icy_sixel) is on rand 0.9; rmcp is on
    # rand 0.10.
    { name = "rand", version = "0.9" },
    { name = "rand_core", version = "0.9" },
    # croner is on strum 0.27; ratatui is on 0.28.
    { name = "strum", version = "0.27" },
    { name = "strum_macros", version = "0.27" },
    # image's tiff decoder is on fax 0.2 and weezl 0.1; pdf_oxide uses the
    # newer release of each directly.
    { name = "fax", version = "0.2" },
    { name = "weezl", version = "0.1" },
    # Both inside pdf_oxide: subsetter's skrifa and write-fonts are on
    # read-fonts 0.39, harfrust on 0.43.
    { name = "read-fonts", version = "0.39" },
    { name = "font-types", version = "0.11" },
    # sherpa-onnx-sys's build script unpacks its archive with bzip2 0.4;
    # zip is on 0.6.
    { name = "bzip2", version = "0.4" },
]

# ---------------------------------------------------------------------------
# Sources: only crates.io is trusted.
# ---------------------------------------------------------------------------
[sources]
unknown-registry = "deny"
unknown-git = "deny"
allow-registry = ["https://github.com/rust-lang/crates.io-index"]
