name: Feature request
description: A new capability or a change to existing behaviour.
labels: ["enhancement"]
body:
  - type: textarea
    id: problem
    attributes:
      label: Problem
      description: What you are trying to do and what gets in the way today.
    validations:
      required: true
  - type: textarea
    id: proposal
    attributes:
      label: Proposed change
      description: What assistd should do instead. Include config keys or CLI flags if you have them in mind.
    validations:
      required: true
  - type: textarea
    id: alternatives
    attributes:
      label: Alternatives considered
  - type: dropdown
    id: area
    attributes:
      label: Area
      multiple: true
      options:
        - CLI / chat TUI
        - Agent loop / daemon
        - LLM backend
        - Tools / commands
        - Memory
        - Voice
        - Window manager
        - MCP
        - Config
        - Packaging
