name: AUR release

on:
  workflow_dispatch:
    inputs:
      tag:
        description: Release tag to package (e.g. v1.2.0)
        required: true
        type: string
      pkgrel:
        description: AUR pkgrel (bump for packaging-only fixes)
        required: true
        default: "1"
        type: string
      publish:
        description: Push to the AUR after the test build passes
        required: true
        default: true
        type: boolean

permissions:
  contents: read

concurrency:
  group: aur-release
  cancel-in-progress: false

env:
  TAG: ${{ inputs.tag }}
  PKGREL: ${{ inputs.pkgrel }}

defaults:
  run:
    shell: bash

jobs:
  build:
    name: Stamp and test-build PKGBUILD
    runs-on: ubuntu-latest
    container: archlinux:base-devel
    timeout-minutes: 90

    steps:
      - name: Validate inputs
        run: |
          [[ "$TAG" =~ ^v[0-9]+\.[0-9]+\.[0-9]+$ ]] \
            || { echo "::error::tag must look like v1.2.3, got '$TAG'"; exit 1; }
          [[ "$PKGREL" =~ ^[1-9][0-9]*$ ]] \
            || { echo "::error::pkgrel must be a positive integer, got '$PKGREL'"; exit 1; }

      # git must exist before checkout, or the action falls back to a
      # tarball without tags.
      - name: Install packaging tools
        run: pacman -Syu --noconfirm --needed git pacman-contrib

      - name: Checkout
        uses: actions/checkout@v7
        with:
          fetch-depth: 0

      # The checkout is owned by the runner user but the container runs
      # as root, so git refuses to read it until it is marked safe.
      - name: Trust the checkout
        run: git config --global --add safe.directory "$GITHUB_WORKSPACE"

      - name: Check tag matches the workspace version
        run: |
          git rev-parse --verify --quiet "refs/tags/$TAG^{commit}" >/dev/null \
            || { echo "::error::tag $TAG does not exist"; exit 1; }
          cargo_version=$(git show "$TAG:Cargo.toml" \
            | sed -n '/^\[workspace.package\]/,/^\[/s/^version = "\(.*\)"/\1/p')
          [[ "$cargo_version" == "${TAG#v}" ]] \
            || { echo "::error::$TAG has workspace version '$cargo_version'"; exit 1; }

      - name: Stamp pkgver and pkgrel
        run: |
          useradd --create-home builder
          cp -r dist/aur/assistd /home/builder/assistd
          sed -i \
            -e "s/^pkgver=.*/pkgver=${TAG#v}/" \
            -e "s/^pkgrel=.*/pkgrel=$PKGREL/" \
            /home/builder/assistd/PKGBUILD
          chown -R builder: /home/builder/assistd

      - name: Install package dependencies
        working-directory: /home/builder/assistd
        run: |
          bash -c 'source ./PKGBUILD; printf "%s\n" "${depends[@]}" "${makedepends[@]}"' \
            | pacman -S --noconfirm --needed -

      - name: Update checksums and .SRCINFO
        working-directory: /home/builder/assistd
        run: runuser -u builder -- bash -c 'updpkgsums && makepkg --printsrcinfo > .SRCINFO'

      - name: Test build
        working-directory: /home/builder/assistd
        run: runuser -u builder -- makepkg --noconfirm

      - name: Collect AUR files
        run: |
          mkdir aur-out
          cp /home/builder/assistd/{PKGBUILD,.SRCINFO,assistd.install} aur-out/
          git diff --no-index dist/aur/assistd/PKGBUILD aur-out/PKGBUILD || true

      - name: Upload AUR files
        uses: actions/upload-artifact@v7
        with:
          name: aur-assistd
          path: aur-out/
          include-hidden-files: true
          if-no-files-found: error
          retention-days: 30

  # Runs apart from the build so the SSH key is never present while
  # third-party build scripts execute.
  publish:
    name: Push to the AUR
    needs: build
    if: inputs.publish && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    environment: aur

    steps:
      - name: Download AUR files
        uses: actions/download-artifact@v8
        with:
          name: aur-assistd
          path: aur-out

      # Ed25519 host key; fingerprint SHA256:RFzBCUItH9LZS0cKB5UE6ceAYhBD5C8GeOBip8Z11+4
      # as published on aur.archlinux.org.
      - name: Configure SSH
        env:
          AUR_SSH_PRIVATE_KEY: ${{ secrets.AUR_SSH_PRIVATE_KEY }}
        run: |
          install -d -m 700 ~/.ssh
          echo 'aur.archlinux.org ssh-ed25519 AAAAC3NzaC1lZDI1NTE5AAAAIEuBKrPzbawxA/k2g6NcyV5jmqwJ2s+zpgZGZ7tpLIcN' \
            > ~/.ssh/known_hosts
          (umask 077 && printf '%s\n' "$AUR_SSH_PRIVATE_KEY" > ~/.ssh/aur)

      - name: Push to the AUR
        env:
          GIT_SSH_COMMAND: ssh -i ~/.ssh/aur -o IdentitiesOnly=yes -o StrictHostKeyChecking=yes
          GIT_AUTHOR_NAME: gnolruf
          GIT_AUTHOR_EMAIL: 112510094+gnolruf@users.noreply.github.com
          GIT_COMMITTER_NAME: gnolruf
          GIT_COMMITTER_EMAIL: 112510094+gnolruf@users.noreply.github.com
        run: |
          git clone ssh://aur@aur.archlinux.org/assistd.git aur-repo
          cp aur-out/{PKGBUILD,.SRCINFO,assistd.install} aur-repo/
          cd aur-repo
          git add PKGBUILD .SRCINFO assistd.install
          if git diff --cached --quiet; then
            echo "AUR already matches ${TAG#v}-$PKGREL; nothing to push."
            exit 0
          fi
          git commit -m "Update to ${TAG#v}-$PKGREL"
          git push origin HEAD:master
