name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  CARGO_TERM_COLOR: always
  CARGO_INCREMENTAL: 0
  RUST_BACKTRACE: short
  # sherpa-onnx-sys links against the prebuilt libraries in
  # SHERPA_ONNX_LIB_DIR instead of extracting them under target/, where
  # rust-cache prunes them while keeping the build script's cached output.
  SHERPA_ONNX_ARCHIVE: sherpa-onnx-v2.0.0-linux-x64-shared-lib.tar.bz2
  SHERPA_ONNX_ARCHIVE_DIR: ${{ github.workspace }}/.sherpa-onnx
  SHERPA_ONNX_LIB_DIR: ${{ github.workspace }}/.sherpa-onnx/sherpa-onnx-v2.0.0-linux-x64-shared-lib/lib

jobs:
  ci:
    name: fmt + clippy + test + release build
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - name: Checkout
        uses: actions/checkout@v7

      # Reads channel + components from rust-toolchain.toml, which tracks
      # the latest stable release.
      - name: Install Rust toolchain (from rust-toolchain.toml)
        uses: actions-rust-lang/setup-rust-toolchain@v2
        with:
          cache: false

      # cpal links to libasound2 on Linux (ALSA backend) and pkg-config
      # is invoked by alsa-sys at build time. ubuntu-latest ships
      # pkg-config but not the alsa headers, so we install them
      # explicitly here.
      - name: Install audio system deps (libasound2)
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends libasound2-dev

      - name: Cache cargo registry and target
        uses: Swatinem/rust-cache@v2
        with:
          shared-key: "ci"
          cache-on-failure: true

      - name: Cache sherpa-onnx archive
        id: sherpa-cache
        uses: actions/cache@v4
        with:
          path: .sherpa-onnx
          key: ${{ env.SHERPA_ONNX_ARCHIVE }}

      - name: Download sherpa-onnx archive
        if: steps.sherpa-cache.outputs.cache-hit != 'true'
        run: |
          mkdir -p "$SHERPA_ONNX_ARCHIVE_DIR"
          curl -fsSL -o "$SHERPA_ONNX_ARCHIVE_DIR/$SHERPA_ONNX_ARCHIVE" \
            "https://github.com/k2-fsa/sherpa-onnx/releases/download/v2.0.0/$SHERPA_ONNX_ARCHIVE"

      - name: Extract sherpa-onnx libraries
        run: |
          [ -d "$SHERPA_ONNX_LIB_DIR" ] || \
            tar -xjf "$SHERPA_ONNX_ARCHIVE_DIR/$SHERPA_ONNX_ARCHIVE" -C "$SHERPA_ONNX_ARCHIVE_DIR"
          ls "$SHERPA_ONNX_LIB_DIR"/libsherpa-onnx-c-api.so "$SHERPA_ONNX_LIB_DIR"/libonnxruntime.so

      - name: Rustfmt (check)
        run: cargo fmt --all -- --check

      - name: Install cargo-machete
        uses: taiki-e/install-action@v2
        with:
          tool: cargo-machete

      - name: Unused dependencies (cargo-machete)
        run: cargo machete

      # Enable the test-support features explicitly so integration test
      # code is still linted/exercised.
      - name: Clippy (deny warnings)
        run: |
          cargo clippy --workspace --all-targets --locked \
            --features assistd-llm/test-support,assistd-voice/test-support \
            -- -D warnings

      - name: Clippy (no optional features)
        run: |
          cargo clippy -p assistd-cli --all-targets --locked \
            --no-default-features -- -D warnings

      - name: Rustdoc (deny warnings)
        env:
          RUSTDOCFLAGS: -D warnings
        run: |
          cargo doc --workspace --no-deps --locked \
            --features assistd-llm/test-support,assistd-voice/test-support

      - name: Test
        run: |
          cargo test --workspace --locked \
            --features assistd-llm/test-support,assistd-voice/test-support

      - name: cargo-deny (advisories, licenses, bans)
        uses: EmbarkStudios/cargo-deny-action@v2
        with:
          command: check
          arguments: --all-features

      - name: Release build (default features)
        run: cargo build --release -p assistd-cli --locked

      - name: Upload release binary
        uses: actions/upload-artifact@v7
        with:
          name: assistd-linux-x86_64
          path: |
            target/release/assistd
            ${{ env.SHERPA_ONNX_LIB_DIR }}/libsherpa-onnx-c-api.so
            ${{ env.SHERPA_ONNX_LIB_DIR }}/libonnxruntime.so
          if-no-files-found: error
          retention-days: 14
