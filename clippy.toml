# Functions past this many lines should be split into named steps.
too-many-lines-threshold = 100
# The test harness captures print output, so tests may print.
allow-print-in-tests = true
# Proper nouns that doc_markdown would otherwise want in backticks.
doc-valid-idents = ["..", "DBus", "GIF89a", "HuggingFace", "MoE", "OpenAI", "RandR", "StatusNotifierItem", "XWayland"]
